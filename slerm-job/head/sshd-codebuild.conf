
# --- codebuild (Code mode build jobs from VM 129), added 2026-10-20 ---
# Must stay at the END of this file: a Match block runs to the end of the config.
# The key lives in a root-owned file and can only run slerm-job-server.
Match User codebuild
    AuthorizedKeysFile /etc/ssh/authorized_keys/codebuild
    ForceCommand /usr/local/bin/slerm-job-server
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    GSSAPIAuthentication no
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    PermitTunnel no
    X11Forwarding no
    PermitTTY no
    PermitUserRC no
