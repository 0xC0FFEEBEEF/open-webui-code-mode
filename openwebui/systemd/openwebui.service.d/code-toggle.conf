# /etc/systemd/system/openwebui.service.d/code-toggle.conf
# Open WebUI copies frontend/static/loader.js over its served static/loader.js at every start, and an upgrade
# replaces the package. Put the Chat | Code toggle back before each start. The leading "-" means a missing
# file can never stop Open WebUI from starting.
[Service]
ExecStartPre=-/bin/sh -c 'for d in /home/owui/.venvs/openwebui/lib/python3*/site-packages/open_webui; do install -m 0644 /home/owui/owui-code-toggle/loader.js "$d/frontend/static/loader.js"; done'
