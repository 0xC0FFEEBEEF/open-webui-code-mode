# 2026-10-18: loader.js is a fixed stub that loads code-toggle.js?v=<code-toggle.version> (code-deploy writes all
# three). Open WebUI copies frontend/static into static/ at every start, so the page script and its version go into
# frontend/static too, the same way code-toggle.conf puts loader.js there (an Open WebUI upgrade replaces that dir).
[Service]
ExecStartPre=-/bin/sh -c 'for d in /home/owui/.venvs/openwebui/lib/python3*/site-packages/open_webui; do for f in code-toggle.js code-toggle.version; do if [ -f "/home/owui/owui-code-toggle/$$f" ]; then install -m 0644 "/home/owui/owui-code-toggle/$$f" "$$d/frontend/static/$$f"; fi; done; done'
